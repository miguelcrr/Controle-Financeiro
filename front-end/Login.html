<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Login</h1>
        <form id="formLogin">  
        <h2>
            <input type="text" placeholder="Usuário" pattern="[a-zA-Z\s!-@]+" id="usuario" required>
        </h2>
        <h3>
            <input type="text" placeholder="Senha" pattern="[a-zA-Z\s!-@]+" id="senha" required>
        </h3>
            <button type="submit">Entrar</button>
        <h4>
            <label>Não possui login?</label>
            <a href="Cadastro.html">Cadastrar</a>
        </h4>
        </form>
</body>
