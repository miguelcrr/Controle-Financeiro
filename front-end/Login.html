<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
    <body>
        <div class="container-pai">
        <div class="caixa">
            <img src="../imagens/porquinho.png" class="imagem">
        </div>
        <div class="caixa">
            <main class="container">
                <h1>Login</h1>
                <form id="formLogin">  
                <h2>
                    <input type="text" placeholder="Usuário" pattern="[a-zA-Z\s!-@]+" id="usuario" required>
                </h2>
                <h3>
                <div class = "partesenha">
                    <input type="password" placeholder="Senha" pattern="[a-zA-Z\s!-@]+" id="senha" required> <button type="button" onclick="mostrarsenha()"></button>
                </div>
                </h3>
                    <button type="submit">Entrar</button>
                <h4>
                    <label>Não possui login?</label>
                    <a href="Cadastro.html">Cadastrar</a>
                </h4>
                    
                    
                    
                </form>
            </main>
        </div>
        <div class="caixa"><img src="../imagens/porquinho.png" class="imagem" ></div>
    </div>
    <div style="text-align: center;">
        <img src="../imagens/logo.png" style="width: 300px" >
    </div>
    


        <script src="script.js"></script>
</body>
</html>
