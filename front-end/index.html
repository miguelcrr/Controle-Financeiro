<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Porquinho+</title>
    <link rel="stylesheet" href="stylehome.css">
</head>
<body>
    <img src="../Imagens/logo2.png" class="logo2" draggable="false">
    <div class="saldoseparação">
    <span>Saldo Atual:</span>
    <span id="saldo">R$ 0,00</span>
    </div>
    <h4>Ganhos/Gastos</h4>
    <div id="listaganhogasto"></div>

    <div class="perfil">
        <button id="botaoperfil" onclick="abrirPerfil()">👤</button>
    </div>
    <div id="menuPerfil" class="sidebar">

    <button class="fecharSidebar" onclick="fecharPerfil()">✖</button>

    <h3>Perfil</h3>

    <div class="opcoesPerfil">
    <button onclick="abrirJanelaUsuario()">⚙ Alterar usuário</button>
    <button onclick="abrirJanelaSenha()">🔒 Alterar senha</button>
    </div>

    <button class="sair" onclick="sair()">🚪 Sair</button>

    </div>
<!--ganhos/gastos-->
    <button type="button" onclick = "ganhos()" id="botaoganhos">Ganhos</button>
    <dialog id="janelaGanhos">
    <div class = "boxganhos">
        <h5>Ganho</h5>
        <input id="ganho"required type="text" placeholder="Ganho"><br>
        <input id="descricaoG" type="text" placeholder="Descrição" pattern="[a-zA-Z\s!-@]+"><br>
        <p id="erro"></p>
        <button id="ganhosADC" onclick="ganhosADC()" type="button">Adicionar</button>
        <button onclick= "xganhos()">Fechar</button>
    </div>
    </dialog>
    <button type="button" onclick = "gastos()">Gastos</button>   
    <dialog id="janelaGastos">
    <h6>Gasto</h6>
    <div class = "boxperdas">
        <input id="gasto" type="text" placeholder="Gasto"><br>
        <input id="descricaoP" type="text" placeholder="Descrição" pattern="[a-zA-Z\s!-@]+"><br>
        <p id="erro2"></p>
        <button id="gastosADC" onclick="gastosADC()" type="button">Adicionar</button>
        <button onclick= "xgastos()">Fechar</button>
    </div>
    </dialog>
<!--ganhos/gastos-->
    <dialog id="janelaedicaoganho">
        <h7>Ganho</h7><br>
        <input id="ganhoeditar" type="text" placeholder="Ganho"><br>
        <input id="descricaoeditarG" type="text" placeholder="Descrição"><br>
        <p id="erro3"></p>
        <button onclick="salvaredicaoG()" type="button">Salvar</button>
        <button onclick= "xedicaoganho()">Cancelar</button>
    </dialog>
    <dialog id="janelaedicaogastos">
        <h8>Gasto</h8><br>
        <input id="gastoeditar" type="text" placeholder="Gasto"><br>
        <input id="descricaoeditarP" type="text" placeholder="Descrição"><br>
        <p id="erro4"></p>
        <button onclick="salvaredicaoP()" type="button">Salvar</button>
        <button onclick= "xedicaogasto()">Cancelar</button>
    </dialog>

    <dialog id="janelaUsuario">
    <h3>Alterar usuário</h3>
    <input
        id="novoUsuario"
        type="text"
        placeholder="Novo usuário"
    >
    <br><br>
    <input
        id="senhaAtualUsuario"
        type="password"
        placeholder="Senha atual"
    >
    <br><br>
    <button onclick="alterarUsuario()">
        Salvar
    </button>
    <button onclick="fecharJanelaUsuario()">
        Cancelar
    </button>
</dialog>
<dialog id="janelaSenha">
    <h3>Alterar senha</h3>
    <input
        id="senhaAtual"
        type="password"
        placeholder="Senha atual"
    >
    <br><br>
    <input
        id="novaSenha"
        type="password"
        placeholder="Nova senha"
    >
    <br><br>
    <input
        id="confirmarSenha"
        type="password"
        placeholder="Confirmar nova senha"
    >
    <br><br>
    <button onclick="alterarSenha()">
        Salvar
    </button>
    <button onclick="fecharJanelaSenha()">
        Cancelar
    </button>
</dialog>


    <script src="scripthome.js"></script>
</body>
</html>
