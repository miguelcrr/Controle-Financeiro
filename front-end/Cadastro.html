<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Cadastro</h1>
        <form id="formCadastro">
            <div class="campo">
                <input type="text" placeholder="Usuário" pattern="[a-zA-Z\s!-@]+" id="usuario" required>
            </div>
            <div class="campo-senha">
                <input type="password" placeholder="Senha" id="senha" required>
                <button type="button" onclick="mostrarsenha()">👁</button>
            </div>

            <div class="campo-senha">
                <input type="password" placeholder="Confirmar senha" id="confsenha" required>
                <button type="button" onclick="mostrarconfsenha()">👁</button>
            </div>
                <button type="submit">Cadastrar</button>
                <p id="errosenha"></p>
            <p>
                <label>Já possui uma conta?</label>
                <a href="Login.html">Entrar</a>
            </p>
        </form>
        </main>
        <img src="../Imagens/logo.png" class="logo">


        <script src="script.js"></script>
        
</body>
</html>
