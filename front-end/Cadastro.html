<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar</title>
    <link rel="stylesheet" href="style.css">
</head>
    <main class="container">
        <h1>Cadastro</h1>
        <form id="formCadastro">
            
            <label for="newusuario">Nome de usuário</label>
            <input type="text" pattern="[a-zA-Z\s!-@]+" id="newusuario" required>
        <h2>
            <label for="senha">Senha</label>
            <input type="text" pattern="[a-zA-Z\s!-@]+" id="senha" required>
        </h2>
        <h3>
            <label for="confsenha">Confirmar senha</label>
            <input type="text" pattern="[a-zA-Z\s!-@]+" id="confsenha" required>
        </h3>
            <button type="submit">Cadastrar</button>
        <h4>
            <label>Já possui uma conta?</label>
            <a href="Login.html">Entrar</a>
        </h4>
        </form>
